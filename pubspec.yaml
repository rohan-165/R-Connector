name: dri_flutter
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8

  # Rooted Device
  flutter_jailbreak_detection_plus: ^1.10.6

  # Get It service
  get_it: ^8.0.3
  # Dependency Injection
  injectable: ^2.5.0

  # Local Storage
  shared_preferences: ^2.3.5

  # Local Database
  # sqflite: ^2.4.2

 # File System
  path_provider: ^2.1.5
  path: ^1.9.1

  # Responsiveness
  flutter_screenutil: ^5.9.3

  # Toaster Service
  fluttertoast: ^8.2.10

  # FLutter Internationalization
  flutter_localization: ^0.3.2
  
  # Flutter Dotenv (Flavor)
  flutter_dotenv: ^5.2.1

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Network Management
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  dartz: ^0.10.1

  # Date and Time
  intl: ^0.20.2

  # Nepali Date and Time Picker
  nepali_date_picker: ^7.0.1
  nepali_utils: ^3.0.8

  # HTML Rendering
  flutter_html: ^3.0.0
  flutter_html_all: ^3.0.0

  # Internet Connectivity
  # This package is used to check the internet connectivity status
  # and to listen for changes in connectivity.
  connectivity_plus: ^7.0.0

  # SVG Images
  flutter_svg: ^2.1.0

  # Image Viewer
  cached_network_image: ^3.4.1

  # Dropdown Search
  dropdown_search: ^6.0.2

  # To use refresh and load more
  pull_to_refresh: ^2.0.0

  # Permission Handler
  permission_handler: ^12.0.1

  # Device Info
  device_info_plus: ^11.4.0

  # Package Info
  package_info_plus: ^8.3.0

  # Location
  geolocator: ^14.0.1

  # Image 
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0

  # Firebase 
  firebase_core: ^3.15.2
  firebase_crashlytics: ^4.3.10

  # Url Luncher
  url_launcher: ^6.3.2

  # QR Code Scanner
  ai_barcode_scanner: ^7.1.0

  
dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^5.0.0
  build_runner: ^2.4.6
  
  # Code generation for Get It service
  injectable_generator: ^2.7.0
  # Commit Agent helper
  commit_agent: ^1.0.0



# The following section is specific to Flutter packages.
